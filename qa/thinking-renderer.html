<!doctype html>
<meta charset="utf-8">
<title>Kirino renderer timing test</title>
<link rel="stylesheet" href="../runtime/thinking.css">
<style>
  #pet {
    width: 192px;
    height: 208px;
    background-image: url("../pet/spritesheet.webp");
    background-size: 800% 1100%;
  }
</style>
<div id="pet" data-codex-pet-id="custom:kirino-chibi" data-codex-pet-state="idle"></div>
<pre id="result">PENDING</pre>
<script>
  const pet = document.querySelector("#pet");
  const result = document.querySelector("#result");
  const check = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const row = () => getComputedStyle(pet).backgroundPositionY;
  const column = () => Math.round(parseFloat(getComputedStyle(pet).backgroundPositionX) * 7 / 100);

  function setState(state, inlinePosition = "0% 0%") {
    pet.dataset.codexPetState = state;
    pet.style.backgroundPosition = inlinePosition;
  }

  function beginThinking() {
    setState("running", "0% 70%");
    const animations = pet.getAnimations();
    check(animations.length === 1, "Expected exactly one thinking animation");
    check(animations[0].effect.getTiming().duration === 10000, "The cycle is not 10 seconds");
    check(animations[0].effect.getTiming().iterations === Infinity, "The cycle must repeat while running");
    animations[0].pause();
    return animations[0];
  }

  window.addEventListener("load", () => {
    try {
      setState("idle");
      check(row() === "0%" && pet.getAnimations().length === 0, "Idle must be static");
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      result.dataset.mode = reducedMotion ? "reduced" : "normal";
      if (reducedMotion) {
        setState("running", "0% 70%");
        check(pet.getAnimations().length === 0, "Reduced motion must prevent looping");
        return;
      }

      const longTask = beginThinking();
      pet.style.backgroundPosition = "0% 0%"; // The stock timer has fallen back to idle.
      for (const [ms, expectedColumn] of [
        [0, 0], [1_000, 1], [2_460, 2], [4_100, 3], [4_300, 4],
        [6_000, 5], [8_500, 1], [9_999, 0], [10_000, 0], [12_460, 2],
        [22_460, 2],
      ]) {
        longTask.currentTime = ms;
        check(row() === "70%" && column() === expectedColumn, "Wrong frame at " + ms + " ms");
      }
      setState("review", "0% 80%");
      check(row() === "80%" && pet.getAnimations().length === 0, "Review must replace thinking");
      setState("idle");
      check(row() === "0%", "Idle must return after completion");

      const shortTask = beginThinking();
      shortTask.currentTime = 500;
      setState("idle");
      check(row() === "0%" && pet.getAnimations().length === 0, "Early completion must cancel thinking");

      beginThinking();
      pet.dataset.kirinoAnimationPaused = "true";
      check(pet.getAnimations().length === 0, "Native animation pause must cancel thinking");
      delete pet.dataset.kirinoAnimationPaused;

      pet.dataset.codexPetId = "codex";
      check(pet.getAnimations().length === 0, "Unrelated pets must keep the native behavior");
    } catch (error) {
      result.textContent = "FAIL: " + error.message;
    } finally {
      if (result.textContent === "PENDING") result.textContent = "PASS";
    }
  });
</script>
