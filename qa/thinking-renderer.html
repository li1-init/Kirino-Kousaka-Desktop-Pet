<!doctype html>
<meta charset="utf-8">
<title>Kirino renderer timing test</title>
<link rel="stylesheet" href="../runtime/thinking.css">
<style>
  #pet {
    width: 192px;
    height: 208px;
    background-image: url("../pet/spritesheet.webp");
    background-size: 800% 1100%;
  }
</style>
<div id="pet" data-codex-pet-id="custom:kirino-chibi" data-codex-pet-state="idle"></div>
<pre id="result">PENDING</pre>
<script>
  const pet = document.querySelector("#pet");
  const result = document.querySelector("#result");
  const check = (condition, message) => {
    if (!condition) throw new Error(message);
  };
  const imageIs = (name) => getComputedStyle(pet).backgroundImage.includes(name);

  function setState(state, active = state === "running") {
    pet.dataset.codexPetState = state;
    pet.dataset.kirinoSessionActive = String(active);
    pet.style.backgroundPosition = state === "running" ? "0% 70%" : "0% 0%";
  }

  function startAnimation(state) {
    setState(state);
    const [animation] = pet.getAnimations();
    check(animation, "Expected animation for " + state);
    animation.pause();
    return animation;
  }

  window.addEventListener("load", () => {
    try {
      const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
      result.dataset.mode = reducedMotion ? "reduced" : "normal";
      if (reducedMotion) {
        for (const state of ["idle", "running"]) {
          setState(state);
          check(pet.getAnimations().length === 0, "Reduced motion must prevent scripted motion");
        }
        return;
      }

      setState("idle", true);
      check(pet.getAnimations().length === 0, "A busy session must block idle play");
      const idle = startAnimation("idle");
      check(idle.effect.getTiming().delay === 6000, "Expected six-second idle delay");
      idle.currentTime = 5900;
      check(imageIs("spritesheet.webp"), "Idle must start with the standing pet");
      idle.currentTime = 6500;
      check(imageIs("laptop-strip.webp"), "Confirmed idle must show laptop play");

      const work = startAnimation("running");
      check(work.effect.getTiming().duration === 65000, "Expected a 65-second work cycle");
      check(work.effect.getTiming().iterations === Infinity, "Work cycle must repeat while active");
      pet.style.backgroundPosition = "0% 0%"; // Simulate the desktop's 2.46-second fallback.
      for (const [time, name] of [
        [0, "laptop-typing.webp"], [2460, "laptop-typing.webp"], [59_999, "laptop-typing.webp"],
        [60_001, "laptop-thinking.webp"], [64_999, "laptop-thinking.webp"], [65_000, "laptop-typing.webp"],
        [124_999, "laptop-typing.webp"], [125_001, "laptop-thinking.webp"], [130_000, "laptop-typing.webp"],
      ]) {
        work.currentTime = time;
        check(imageIs(name), "Wrong work phase at " + time + " ms");
      }
      work.currentTime = 62_000;
      setState("review");
      check(pet.getAnimations().length === 0 && imageIs("spritesheet.webp"),
            "Task completion must stop a seated thinking pause immediately");
      const next = startAnimation("running");
      next.currentTime = 0;
      check(imageIs("laptop-typing.webp"), "A new task must begin at typing");
      pet.dataset.kirinoAnimationPaused = "true";
      check(pet.getAnimations().length === 0, "Native pause must return control to the atlas");
      delete pet.dataset.kirinoAnimationPaused;
      pet.dataset.codexPetId = "codex";
      check(pet.getAnimations().length === 0, "Other pets must keep the native behavior");
    } catch (error) {
      result.textContent = "FAIL: " + error.message;
    } finally {
      if (result.textContent === "PENDING") result.textContent = "PASS";
    }
  });
</script>
