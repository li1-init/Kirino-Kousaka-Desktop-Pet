<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Windows 桌宠动作预览</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color-scheme:dark;color:#f2edf6;background:#17141c;--panel:#221d29;--muted:#c1b4cb;--line:#4b3e56;--accent:#dbbdf7}
*{box-sizing:border-box}
body{margin:0}
main{max-width:1100px;margin:38px auto;padding:0 22px}
h1{font-size:28px;letter-spacing:-.025em;margin:0 0 16px}
.workspace{display:grid;grid-template-columns:minmax(208px,255px) minmax(0,1fr);gap:13px;align-items:start}
nav,.player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
nav{max-height:590px;overflow:auto;padding:7px}
button{font:inherit;cursor:pointer;color:inherit;background:#302637;border:1px solid #5d4a6c;border-radius:8px;padding:6px 11px}
button:hover{background:#3b2e47}
button:disabled{opacity:.43;cursor:default}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav button{display:flex;text-align:left;gap:9px;width:100%;border-color:transparent;background:transparent;padding:8px}
nav button[aria-current=true]{background:#453252;border-color:#6d5680}
nav .seq{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;padding-top:2px}
.player header,.footer,.controls{padding:12px 16px}
.player header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h2{font-size:20px;margin:0}
.pager{display:flex;gap:7px;align-items:center;white-space:nowrap}
.stage{display:grid;place-items:center;min-height:350px;background:repeating-conic-gradient(#302b38 0 25%,#393240 0 50%) 50%/24px 24px;position:relative}
.stage.light{background:repeating-conic-gradient(#f4eff6 0 25%,#e7e1ec 0 50%) 50%/24px 24px}
canvas,img{display:block;max-width:100%;height:auto}
canvas,img{min-height:0}
[hidden]{display:none!important}
.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.speed{display:flex;align-items:center;gap:8px;flex:1;flex-wrap:wrap;min-width:195px}
input[type=range]{min-width:100px;width:min(205px,37vw);accent-color:#dabcf8}
output{min-width:3ch;color:var(--accent);font-variant-numeric:tabular-nums}
.footer{border-top:1px solid var(--line);color:var(--muted);font-size:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
a{color:var(--accent)}
#status{position:absolute;bottom:8px;left:12px;padding:3px 7px;border-radius:6px;background:#231d2c;color:#f4eaf9;font-size:13px}
@media(max-width:770px){main{padding:0 12px;margin:18px auto}.workspace{grid-template-columns:1fr}.player{grid-row:1}nav{max-height:200px}.stage{min-height:270px}.player header{align-items:flex-start}}
@media(max-width:490px){.player header{flex-wrap:wrap}.controls{padding:10px}}
.session{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.session small{color:var(--muted)}
.session select{font:inherit;color:inherit;border:1px solid #5d4a6c;border-radius:8px;background:#302637;padding:6px 10px}
.session button[aria-pressed=true]{background:var(--accent);color:#261c30}
</style>
<main>
<h1>桌宠动作预览</h1>
<div class="session" aria-label="桐乃会话动作">
<label for="sessionStyle">会话造型</label>
<select id="sessionStyle"><option value="cushion">坐垫版</option><option value="chair">木凳版</option></select>
<button id="demo" type="button" aria-pressed="false">开始会话演示</button>
<button id="tryThought" type="button">试播思考</button>
<button id="tryGlance" type="button">试播看向我</button>
<small id="demoClock">每 30 秒思考 · 每 2 分钟看向你</small>
</div>
<div class="workspace">
<nav id="actions" aria-label="选择动作"></nav>
<section class="player" aria-label="动作播放器">
<header><h2 id="name"></h2><div class="pager">
  <button id="prev" aria-label="上一个动作">上一个</button><span id="position"></span><button id="next" aria-label="下一个动作">下一个</button>
</div></header>
<div id="stage" class="stage">
  <canvas id="canvas" hidden></canvas><img id="fallback" alt="">
  <span id="status" aria-live="polite" hidden></span>
</div>
<div class="controls">
  <button id="pause" type="button">暂停</button>
  <button id="restart" type="button">重播</button>
  <div class="speed">
    <label for="speed">播放速度</label><input id="speed" type="range" step="1" value="100">
    <output id="speedValue" for="speed">100%</output><button id="reset" type="button">恢复默认</button>
  </div>
  <button id="background" type="button" aria-pressed="false">浅色背景</button>
</div>
<div class="footer"><span id="meta"></span><span><a id="source" target="_blank" rel="noreferrer">B 站参考</a> · <a id="download">打开 WebP</a></span></div>
</section>
</div>
</main>

  atlas = null;
  paused = false;
  const clip = clips[index];
  items.forEach((item, i) => item.setAttribute("aria-current", String(index === i)));
  id("name").textContent = clip.name;
  id("position").textContent = (index + 1) + " / " + clips.length;
  id("prev").disabled = index === 0;
  id("next").disabled = index + 1 === clips.length;
  id("source").href = clip.source;
  id("source").textContent = clip.sourceLabel || "B 站参考";
  id("download").href = clip.webp;
  id("pause").disabled = true;
  id("pause").textContent = "暂停";
  id("restart").disabled = true;
  id("reset").disabled = true;
  speed.disabled = true;
  speed.min = clip.minSpeed;
  speed.max = clip.maxSpeed;
  speed.value = speeds[clip.id] ?? 100;
  controls();
  canvas.hidden = true;
  canvas.width = clip.width;
  canvas.height = clip.height;
  canvas.setAttribute("aria-label", clip.name);
  fallback.hidden = false;
  fallback.alt = clip.name;
  fallback.src = clip.webp;
  status.hidden = false;
  status.textContent = "正在加载调速预览";
  const token = ++generation;
  const ready = image => {
    if (token !== generation) return;
    atlas = image;
    if (index === typing || index === thought || index === glance) sessionAtlases.set(index, image);
    canvas.hidden = false;
    fallback.hidden = true;
    fallback.removeAttribute("src");
    status.hidden = true;
    speed.disabled = false;
    id("pause").disabled = false;
    id("restart").disabled = false;
    id("reset").disabled = false;
    paint();
    pending = requestAnimationFrame(tick);
  };
  const cached = sessionAtlases.get(index);
  if (cached) {
    ready(cached);
    return;
  }
  const image = new Image();
  image.onload = () => ready(image);
  image.onerror = () => {
    if (token === generation) status.textContent = "调速预览加载失败，正在播放默认版";
  };
  image.src = clip.atlas;
}
id("prev").onclick = () => select(current - 1);
id("next").onclick = () => select(current + 1);
id("pause").onclick = () => {
  paused = !paused;
  id("pause").textContent = paused ? "继续" : "暂停";
  if (paused) stopClock();
  else if (atlas && !pending) pending = requestAnimationFrame(tick);
};
id("restart").onclick = () => { phase = 0; paint(); };
id("reset").onclick = () => setSpeed(100);
id("background").onclick = () => {
  const light = id("stage").classList.toggle("light");
  id("background").setAttribute("aria-pressed", String(light));
  id("background").textContent = light ? "深色背景" : "浅色背景";
};
speed.oninput = () => setSpeed(Number(speed.value));
id("sessionStyle").onchange = event => {
  endDemo();
  chooseStyle(event.target.value);
  select(typing, true);
};
id("demo").onclick = () => {
  if (session.running) {
    endDemo();
    select(typing, true);
  } else startDemo();
};
id("tryThought").onclick = () => playSessionAction(thought);
id("tryGlance").onclick = () => playSessionAction(glance);
select(typing);
</script>
</html>
